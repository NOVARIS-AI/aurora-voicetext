name: VoiceText Web CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run VoiceText tests
        run: npm test
      - name: Build VoiceText web app
        run: npm run build
