name: Build AURORA VoiceText APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Frontend TypeScript validation
        run: npx tsc --noEmit

      - name: Backend TypeScript validation
        run: npx tsc --noEmit -p tsconfig.backend.json

      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://aurora-voicetext.vercel.app
          VITE_BACKUP_API_BASE_URL: ${{ vars.BACKUP_API_BASE_URL }}
          VITE_BACKUP_API_PUBLIC_FALLBACK: 'true'

      - name: Generate Android project
        run: npx cap add android

      - name: Set monotonic Android app version
        run: node scripts/patch-android-version.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Generate AURORA VoiceText launcher icons
        run: python3 scripts/generate-android-icons.py

      - name: Install Android foreground transcription service
        run: node scripts/patch-android-background.mjs

      - name: Install native Android Vosk speech recognition
        run: node scripts/patch-android-native-speech.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Restore persistent AURORA Android signing identity
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing AURORA_DEBUG_KEYSTORE_BASE64. Add the same persistent keystore secret used by the AURORA Voice Assistant repository."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          # Capacitor's generated Android template can resolve the debug key from
          # the app module directory. Put the exact same persistent key in both
          # supported locations so Gradle cannot silently use a runner-generated key.
          mkdir -p android/app
          cp "$HOME/.android/debug.keystore" android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          cmp -s "$HOME/.android/debug.keystore" android/app/debug.keystore
          echo "Persistent AURORA signing identity restored in both Gradle debug-keystore locations."

      - name: Pin Gradle debug signing to the persistent keystore
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Keep debug builds on the user's persistent AURORA identity.
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE

      - name: Build debug APK with persistent signing identity
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signature and prepare direct download
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          KEY_SHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{print $NF; exit}' | tr -d ':')
          echo "Persistent keystore SHA-256: $KEY_SHA"
          echo "APK signer SHA-256: $APK_SHA"
          if [ -z "$KEY_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK signing certificate does not match the configured keystore."
            exit 1
          fi
          cp "$APK" AURORA-VoiceText.apk
          sha256sum AURORA-VoiceText.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-voicetext-android-apk
          path: AURORA-VoiceText.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-voicetext-android-${{ github.run_number }}
          name: AURORA VoiceText Android build ${{ github.run_number }}
          body: |
            Automatically generated debug APK from the main branch.
            This APK uses the persistent AURORA signing identity and an increasing Android version code.
            Install AURORA-VoiceText.apk directly on a compatible Android device.
            This is a test build, not a Google Play release.
          files: AURORA-VoiceText.apk
          prerelease: true
