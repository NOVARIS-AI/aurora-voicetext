name: Build AURORA VoiceText APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Frontend TypeScript validation
        run: npx tsc --noEmit

      - name: Backend TypeScript validation
        run: npx tsc --noEmit -p tsconfig.backend.json

      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://aurora-voicetext.vercel.app
          VITE_BACKUP_API_BASE_URL: ${{ vars.BACKUP_API_BASE_URL }}
          VITE_BACKUP_API_PUBLIC_FALLBACK: 'true'

      - name: Generate Android project
        run: npx cap add android

      - name: Generate AURORA VoiceText launcher icons
        run: python3 scripts/generate-android-icons.py

      - name: Install Android foreground transcription service
        run: node scripts/patch-android-background.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify and prepare direct APK download
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk AURORA-VoiceText.apk
          sha256sum AURORA-VoiceText.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-voicetext-android-apk
          path: AURORA-VoiceText.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-voicetext-android-\${{ github.run_number }}
          name: AURORA VoiceText Android build \${{ github.run_number }}
          body: |
            Automatically generated debug APK from the main branch.
            Install AURORA-VoiceText.apk directly on a compatible Android device.
            This is a test build, not a signed Google Play release.
          files: AURORA-VoiceText.apk
          prerelease: true
