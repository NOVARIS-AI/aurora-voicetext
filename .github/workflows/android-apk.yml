name: Build AURORA VoiceText APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Frontend TypeScript validation
        run: npx tsc --noEmit

      - name: Backend TypeScript validation
        run: npx tsc --noEmit -p tsconfig.backend.json

      - name: Build web application
        run: npm run build
        env:
          VITE_BACKUP_API_BASE_URL: ${{ vars.BACKUP_API_BASE_URL }}
          VITE_BACKUP_API_PUBLIC_FALLBACK: 'true'

      - name: Generate Android project
        run: npx cap add android

      - name: Install Android foreground transcription service
        run: node scripts/patch-android-background.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-voicetext-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
