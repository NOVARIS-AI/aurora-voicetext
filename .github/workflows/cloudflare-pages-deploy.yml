name: Deploy AURORA VoiceText to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/cloudflare-pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: aurora-voicetext-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_API_TOKEN: ${{ secrets.BACKUP_API_TOKEN }}
      BACKUP_API_BASE_URL: https://aurora-voicetext.alwerioghenepeace563.workers.dev
      PROJECT_NAME: aurora-voicetext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing test suite
        run: npm test
      - name: Build existing AURORA VoiceText app
        run: npm run build
      - name: Install Wrangler
        run: npm install --global wrangler@4.157.0
      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_PAGES_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          test -n "$BACKUP_API_TOKEN" || (echo "Missing BACKUP_API_TOKEN repository secret" && exit 1)
      - name: Create Pages project if it does not exist
        run: |
          projects="$(wrangler pages project list)"
          if ! printf '%s' "$projects" | grep -Fq "$PROJECT_NAME"; then
            wrangler pages project create "$PROJECT_NAME" --production-branch main
          else
            echo "Cloudflare Pages project already exists."
          fi
      - name: Configure private Worker connection on Pages
        run: |
          printf '%s' "$BACKUP_API_TOKEN" | wrangler pages secret put BACKUP_API_TOKEN --project-name="$PROJECT_NAME"
          printf '%s' "$BACKUP_API_BASE_URL" | wrangler pages secret put BACKUP_API_BASE_URL --project-name="$PROJECT_NAME"
      - name: Deploy production website
        run: wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
