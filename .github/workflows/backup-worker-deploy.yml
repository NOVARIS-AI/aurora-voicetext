name: Deploy AURORA VoiceText backup worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backup-worker/**'
      - '.github/workflows/backup-worker-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_API_TOKEN: ${{ secrets.BACKUP_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
      - name: Install Wrangler
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: backup-worker
        run: npm install --global wrangler
      - name: Configure backup authentication
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: backup-worker
        run: |
          if [ -n "$BACKUP_API_TOKEN" ]; then printf '%s' "$BACKUP_API_TOKEN" | wrangler secret put BACKUP_API_TOKEN; fi
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | wrangler secret put GROQ_API_KEY; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY; fi
      - name: Deploy independent backup API
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: backup-worker
        run: wrangler deploy
      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets to enable backup deployment."
