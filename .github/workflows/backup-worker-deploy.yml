name: Deploy AURORA VoiceText backup worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backup-worker/**'
      - '.github/workflows/backup-worker-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_API_TOKEN: ${{ secrets.BACKUP_API_TOKEN }}
      BACKUP_PUBLIC_FALLBACK: ${{ secrets.BACKUP_PUBLIC_FALLBACK }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
      ELEVENLABS_VOICE_NOVA_ID: ${{ secrets.ELEVENLABS_VOICE_NOVA_ID }}
      ELEVENLABS_VOICE_SHIMMER_ID: ${{ secrets.ELEVENLABS_VOICE_SHIMMER_ID }}
      ELEVENLABS_VOICE_CORAL_ID: ${{ secrets.ELEVENLABS_VOICE_CORAL_ID }}
      ELEVENLABS_VOICE_SAGE_ID: ${{ secrets.ELEVENLABS_VOICE_SAGE_ID }}
      ELEVENLABS_VOICE_ONYX_ID: ${{ secrets.ELEVENLABS_VOICE_ONYX_ID }}
      ELEVENLABS_VOICE_ECHO_ID: ${{ secrets.ELEVENLABS_VOICE_ECHO_ID }}
      ELEVENLABS_VOICE_ASH_ID: ${{ secrets.ELEVENLABS_VOICE_ASH_ID }}
      ELEVENLABS_VOICE_FABLE_ID: ${{ secrets.ELEVENLABS_VOICE_FABLE_ID }}
      ELEVENLABS_VOICE_ALLOY_ID: ${{ secrets.ELEVENLABS_VOICE_ALLOY_ID }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
      OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
      OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
      OPENSUBTITLES_USER_AGENT: ${{ secrets.OPENSUBTITLES_USER_AGENT }}
    defaults:
      run:
        working-directory: backup-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate Worker bundle
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: wrangler deploy --dry-run
      - name: Configure provider secrets
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if [ -n "$BACKUP_API_TOKEN" ]; then printf '%s' "$BACKUP_API_TOKEN" | wrangler secret put BACKUP_API_TOKEN; fi
          if [ -n "$BACKUP_PUBLIC_FALLBACK" ]; then printf '%s' "$BACKUP_PUBLIC_FALLBACK" | wrangler secret put BACKUP_PUBLIC_FALLBACK; fi
          if [ -n "$ASSEMBLYAI_API_KEY" ]; then printf '%s' "$ASSEMBLYAI_API_KEY" | wrangler secret put ASSEMBLYAI_API_KEY; fi
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | wrangler secret put GROQ_API_KEY; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then printf '%s' "$OPENROUTER_API_KEY" | wrangler secret put OPENROUTER_API_KEY; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY; fi
          if [ -n "$ELEVENLABS_API_KEY" ]; then printf '%s' "$ELEVENLABS_API_KEY" | wrangler secret put ELEVENLABS_API_KEY; fi
          if [ -n "$ELEVENLABS_DEFAULT_VOICE_ID" ]; then printf '%s' "$ELEVENLABS_DEFAULT_VOICE_ID" | wrangler secret put ELEVENLABS_DEFAULT_VOICE_ID; fi
          for voice in NOVA SHIMMER CORAL SAGE ONYX ECHO ASH FABLE ALLOY; do
            variable="ELEVENLABS_VOICE_${voice}_ID"
            value="$(printenv "$variable" || true)"
            if [ -n "$value" ]; then printf '%s' "$value" | wrangler secret put "$variable"; fi
          done
          if [ -n "$OPENSUBTITLES_API_KEY" ]; then printf '%s' "$OPENSUBTITLES_API_KEY" | wrangler secret put OPENSUBTITLES_API_KEY; fi
          if [ -n "$OPENSUBTITLES_USERNAME" ]; then printf '%s' "$OPENSUBTITLES_USERNAME" | wrangler secret put OPENSUBTITLES_USERNAME; fi
          if [ -n "$OPENSUBTITLES_PASSWORD" ]; then printf '%s' "$OPENSUBTITLES_PASSWORD" | wrangler secret put OPENSUBTITLES_PASSWORD; fi
          if [ -n "$OPENSUBTITLES_USER_AGENT" ]; then printf '%s' "$OPENSUBTITLES_USER_AGENT" | wrangler secret put OPENSUBTITLES_USER_AGENT; fi
      - name: Deploy independent backup API
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: wrangler deploy
      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Worker source is ready. Add Cloudflare deployment credentials to activate the independent backend."
